# Active environment: "local" or "remote"
# Override with --env flag: python main.py --env remote
active_env = "local"

# ============ Default Settings (shared) ============
delivery_radius_km = 5
for_latex = true  # Set to true for LaTeX export (PDF format)
plot_title = false  # Set to true to show titles/info boxes (e.g. for posters); adds _t suffix to filenames
roadnet_visualization = false  # Set to false to skip road network visualization (slow at city scale)

# OD pair generation parameters
[od_params]
impedance_type = "tanner"   # "power_law" or "tanner"
alpha = 1.7                 # Building volume exponent (shared)
# Tanner: f(d) = d^tanner_a * exp(-tanner_b * d), peak at tanner_a/tanner_b
tanner_a = 1.1131            # Calibrated from 278K Eleme orders (29 days)
tanner_b = 1.4115            # Peak distance = a/b = 0.79 km, R² = 0.986
# Legacy power-law (when impedance_type = "power_law")
g_param = [1, 1.7, 0.5]       # Gravity model parameters: [alpha, beta, gamma]
min_distance_km = 0.05    # Minimum distance to avoid division issues
min_sales = 5             # Minimum annual sales threshold per building

# Sensitivity stage parameters
[sensitivity]
enable = true            # Set false to skip the sensitivity stage entirely
skip_if_done = true      # If all 4 output CSVs exist, skip recomputation
sobol_n = 512            # Saltelli sample size (yields N*(d+2) per-city LCA runs)
sobol_seed = 42          # Seed for reproducible Saltelli draws

# Equity analysis parameters
[equity_params]
unit_lat = 0.02          # ~2.2 km grid cell height
unit_lng = 0.02          # ~1.8 km grid cell width
min_deliveries_per_zone = 10
exclude_outliers = true  # Remove outliers using IQR method

# Emission model parameters
[emission_params]
payload_kg = 1.0          # Default payload weight (kg)
rider_weight = 70         # E-bike rider weight (kg)
e_use = 0.4               # Grid emission factor (kg CO2e/kWh)

[emission_params.ebike]
velocity = 30             # E-bike velocity (km/h)
kappa = 0.7692307692307692 # Effective per-order e-bike distance factor: 1 / sqrt(1.69)

[emission_params.drone]
v_level = 60              # Horizontal flight speed (km/h)
v_vertical = 20           # Vertical takeoff/landing speed (km/h)
h_takeoff = 100           # Takeoff height (m)
hover_time = 10           # Hover time per delivery (s)

[emission_params.ecar]
velocity = 30             # Urban delivery speed (km/h)

[emission_params.gasoline_car]
velocity = 30             # Urban delivery speed (km/h)
engine_efficiency = 0.25  # Gasoline engine thermal efficiency

