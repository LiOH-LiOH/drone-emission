# Active environment: "local" or "remote"
# Override with --env flag: python main.py --env remote
active_env = "local"

# ============ Default Settings (shared) ============
delivery_radius_km = 3
for_latex = true  # Set to true for LaTeX export (PDF, no titles/info boxes)

# OD pair generation parameters
[od_params]
g_param = [1, 1.7, 0.5]       # Gravity model parameters: [alpha, beta, gamma]
min_distance_km = 0.05    # Minimum distance to avoid division issues
min_sales = 5             # Minimum annual sales threshold per building

# Equity analysis parameters
[equity_params]
unit_lat = 0.01          # ~1.1 km grid cell height
unit_lng = 0.01          # ~0.9 km grid cell width
min_deliveries_per_zone = 10
exclude_outliers = true  # Remove outliers using IQR method

# Emission model parameters
[emission_params]
payload_kg = 1.0          # Default payload weight (kg)
rider_weight = 70         # E-bike rider weight (kg)
e_use = 0.4               # Grid emission factor (kg CO2e/kWh)

[emission_params.ebike]
velocity = 30             # E-bike velocity (km/h)

[emission_params.drone]
v_level = 60              # Horizontal flight speed (km/h)
v_vertical = 20           # Vertical takeoff/landing speed (km/h)
h_takeoff = 100           # Takeoff height (m)
hover_time = 10           # Hover time per delivery (s)

# ============ Local Environment ============
[local]
data_dir = "/Users/linjingxian/Code/drone-emission/data"
figures_dir = "/Users/linjingxian/Code/drone-emission/figures"
sales_path = "/Users/linjingxian/Code/drone-emission/data/combined_data.csv"
gef_path = "/Users/linjingxian/Code/drone-emission/data/gef_china.csv"
fetch_buildings = false
fetch_roadnet = false

# ============ Remote Environment ============
[remote]
data_dir = "/home/jingxian/code/drone-emission/data"
figures_dir = "/home/jingxian/code/drone-emission/figures"
sales_path = "/home/jingxian/code/drone-emission/data/combined_data.csv"
gef_path = "/home/jingxian/code/drone-emission/data/gef_china.csv"
buildings_data_dir = "/home/jingxian/data/province"  # CMAB building data directory
fetch_buildings = false
fetch_roadnet = false