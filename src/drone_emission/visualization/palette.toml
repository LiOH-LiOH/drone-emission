# Current paper palette. Edit here, then render --from-bundle.
# Semantic @aliases deliberately share identities across figures.
# Start with mode.*, region.* and scale.* for cross-figure experiments.
# Thematic keys below are local overrides; their hex suffix is a stable ID.
[colors]
# 1. Delivery modes and routes
"mode.drone" = "#0072B2"
"mode.pedelec_ebike" = "#E69F00"
"mode.pedal_bicycle" = "#009E73"
"mode.electric_moped" = "#56B4E9"
